<script>
  (function() {
    const favBtn = document.getElementById('favorite-toggle');
    const favIcon = document.getElementById('fav-icon');
    let isFav = true;

    if (favBtn && favIcon) {
      favBtn.addEventListener('click', () => {
        isFav = !isFav;
        if (isFav) {
          favIcon.style.fontVariationSettings = "'FILL' 1";
          favBtn.classList.add('text-primary');
          favBtn.classList.remove('text-on-surface-variant');
        } else {
          favIcon.style.fontVariationSettings = "'FILL' 0";
          favBtn.classList.remove('text-primary');
          favBtn.classList.add('text-on-surface-variant');
        }
      });
    }

    const playPauseBtn = document.getElementById('play-pause-btn');
    const playPauseIcon = document.getElementById('play-pause-icon');
    let isPlaying = true;

    if (playPauseBtn && playPauseIcon) {
      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      });
    }

    const timerChip = document.getElementById('sleep-timer-chip');
    const timerLabel = document.getElementById('timer-label');
    const timerStates = ['Off • Tap to set', '15 mins', '30 mins', '45 mins', 'End of track'];
    let timerIndex = 0;

    if (timerChip && timerLabel) {
      timerChip.addEventListener('click', () => {
        timerIndex = (timerIndex + 1) % timerStates.length;
        timerLabel.textContent = timerStates[timerIndex];
      });
    }

    const repeatBtn = document.getElementById('repeat-btn');
    let repeatState = 1; // 0: off, 1: all, 2: one
    if (repeatBtn) {
      repeatBtn.addEventListener('click', () => {
        repeatState = (repeatState + 1) % 3;
        const icon = repeatBtn.querySelector('.material-symbols-outlined');
        const dot = repeatBtn.querySelector('span:last-child');
        if (repeatState === 0) {
          repeatBtn.classList.remove('text-primary');
          repeatBtn.classList.add('text-on-surface-variant');
          if (dot) dot.classList.add('hidden');
          if (icon) icon.textContent = 'repeat';
        } else if (repeatState === 1) {
          repeatBtn.classList.add('text-primary');
          repeatBtn.classList.remove('text-on-surface-variant');
          if (dot) dot.classList.remove('hidden');
          if (icon) icon.textContent = 'repeat';
        } else {
          repeatBtn.classList.add('text-primary');
          repeatBtn.classList.remove('text-on-surface-variant');
          if (dot) dot.classList.remove('hidden');
          if (icon) icon.textContent = 'repeat_one';
        }
      });
    }

    const shuffleBtn = document.getElementById('shuffle-btn');
    let isShuffle = true;
    if (shuffleBtn) {
      shuffleBtn.addEventListener('click', () => {
        isShuffle = !isShuffle;
        if (isShuffle) {
          shuffleBtn.classList.add('text-primary');
          shuffleBtn.classList.remove('text-on-surface-variant');
        } else {
          shuffleBtn.classList.remove('text-primary');
          shuffleBtn.classList.add('text-on-surface-variant');
        }
      });
    }
  })();
