name: CI

on:
  push:
    branches: [ main, 'fix-**' ]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew assembleDebug test --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: R8 (release shrinking, no signing)
        run: ./gradlew minifyReleaseWithR8 --console=plain

      - name: Permission guard
        run: bash scripts/check-permissions.sh

      # The release tool must keep producing envelopes the app accepts (fixture made by the tool).
      - name: Update manifest tool check
        run: |
          python3 scripts/update_manifest.py verify app/src/test/resources/update/script-envelope.json             --trusted-public-key "$(cat app/src/test/resources/update/script-envelope.pub)"
          if python3 scripts/update_manifest.py verify app/src/test/resources/update/script-envelope.json; then
            echo "::error::test-signed manifest verified against the production key"; exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/build/reports/tests
            **/build/test-results

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  # Room migration and playlist DAO tests (app/src/androidTest) on an Android 9 emulator,
  # the same OS version as the A1k test phone.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain

      - name: Instrumented tests (API 28 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
